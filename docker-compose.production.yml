services:
  api:
    build: ./server
    environment:
      NODE_ENV: production
      PORT: 5000
      AI_SERVICE_URL: http://ai:8000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      PERSISTENT_STORAGE_DIR: /data
    volumes: ["api-data:/data"]
    ports: ["5000:5000"]
    depends_on: [ai]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  ai:
    build: ./ai-service
    environment:
      ENVIRONMENT: production
      PORT: 8000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      OUTPUTS_DIR: /data/outputs
    volumes: ["ai-data:/data"]
    ports: ["8000:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  api-data:
  ai-data:
